server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (necessário pro React Router funcionar em /transactions, /accounts etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
